<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g id="02 Log in"><rect x="0" y="0" width="1440" height="900" fill="#ffffff"/><g id="Brand panel"><rect x="0" y="0" width="600" height="900" fill="#09090b"/><rect x="48" y="48" width="32" height="32" rx="8" fill="#615fff"/><text x="57.2" y="68" fill="#ffffff" font-family="Inter" font-size="12" font-weight="700" xml:space="preserve">LL</text><text x="90" y="70" fill="#ffffff" font-family="Inter" font-size="18" font-weight="600" xml:space="preserve">Linear-lite</text><text x="48" y="263.38" fill="#ffffff" font-family="Inter" font-size="32" font-weight="600" letter-spacing="-0.8" xml:space="preserve">Plan, track and ship.</text><text x="48" y="303.38" fill="#ffffff" font-family="Inter" font-size="32" font-weight="600" letter-spacing="-0.8" xml:space="preserve">Together, in real time.</text><text x="48" y="341.38" fill="#9f9fa9" font-family="Inter" font-size="15" font-weight="400" xml:space="preserve">An issue tracker for small teams. Every change shows up on</text><text x="48" y="365.75" fill="#9f9fa9" font-family="Inter" font-size="15" font-weight="400" xml:space="preserve">everyone's screen the moment it happens.</text><g id="Board preview"><rect x="47.5" y="412.63" width="157" height="179.5" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.102" stroke-width="1"/><rect x="48" y="413.13" width="156" height="178.5" rx="12" fill="#18181b"/><g transform="translate(60 425.38) scale(0.8571 0.8571)"><circle cx="7" cy="7" r="6" fill="none" stroke="#71717b" stroke-width="1.5"></circle></g><text x="78" y="435.13" fill="#9f9fa9" font-family="Inter" font-size="11" font-weight="400" xml:space="preserve">Todo</text><rect x="56" y="447.63" width="140" height="64" rx="8" fill="#27272a"/><rect x="66" y="457.63" width="96" height="6" rx="3" fill="#52525c"/><rect x="66" y="469.63" width="60" height="6" rx="3" fill="#3f3f47"/><rect x="66" y="487.63" width="36" height="12" rx="6" fill="#3f3f4