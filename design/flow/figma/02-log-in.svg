"6.5" fill="none" stroke="#ffffff" stroke-opacity="0.102" stroke-width="1"/><rect x="48" y="824" width="28" height="28" rx="6" fill="#ffffff" fill-opacity="0.051"/><g transform="translate(55 831) scale(0.5833 0.5833)"><g fill="none" stroke="#7c86ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-2.5-5.1"></path></g></g><text x="88" y="843" fill="#d4d4d8" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Free for teams of up to 10 people</text></g><g id="Log in form"><text x="830" y="175" fill="#18181b" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.6" xml:space="preserve">Welcome back</text><text x="830" y="204" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Log in to your Acme workspace.</text><g id="Button Google"><rect x="830.5" y="237.5" width="379" height="39" rx="5.5" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/><text x="937.31" y="262.28" fill="#155dfc" font-family="Inter" font-size="15" font-weight="700" xml:space="preserve">G</text><text x="958.58" y="262" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Continue with Google</text></g><rect x="830" y="308.5" width="172.14" height="1" fill="#e4e4e7"/><text x="1014.14" y="313" fill="#9f9fa9" font-family="Inter" font-size="12" font-weight="400" xml:space="preserve">or</text><rect x="1037.86" y="308.5" width="172.14" height="1" fill="#e4e4e7"/><g id="Error banner"><rect x="830.5" y="341.5" width="379" height="87" rx="5.5" fill="#fef2f2" stroke="#ffc9c9" stroke-width="1"/><g transform="translate(843 356) scale(0.6667 0.6667)"><g fill="none" stroke="#e7000b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></g></g><text x="869" y="369" fill="#9f0712" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Wrong email or password</text><text x="869" y="391" fill="#c10007" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Check them and try again, or reset your</text><text x="869" y="411" fill="#c10007" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">password.</text></g><g id="Field Email"><text x="830" y="464" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Email</text><rect x="830.5" y="475.5" width="379" height="39" rx="5.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="843" y="500.5" fill="#18181b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">aarav@acme.dev</text></g><g id="Field Password"><text x="830" y="546" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Password</text><text x="1107.3" y="545" fill="#4f39f6" font-family="Inter" font-size="12" font-weight="500" xml:space="preserve">Forgot password?</text><rect x="828" y="555" width="384" height="44" rx="8" fill="none" stroke="#ffe2e2" stroke-width="4"/><rect x="830.5" y="557.5" width="379" height="39" rx="5.5" fill="none" stroke="#ff6467" stroke-width="1"/><text x="843" y="582.5" fill="#18181b" font-family="Inter" font-size="14" font-weight="400" letter-spacing="1.4" xml:space="preserve">••••••••</text></g><rect x="830" y="615" width="16" height="16" rx="4" fill="#4f39f6"/><g transform="translate(832 617) scale(0.5 0.5)"><g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></g></g><text x="854" y="628" fill="#52525c" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Keep me logged in</text><g id="Button Log in"><rect x="830" y="657" width="380" height="40" rx="6" fill="#4f39f6"/><text x="999.63" y="682" fill="#ffffff" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Log in</text></g><text x="894.7" y="744" fill="#52525c" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">New to Linear-lite?</text><text x="1022.72" y="744" fill="#4f39f6" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Create an account</text></g></g></svg>
