<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g id="05 Create workspace"><rect x="0" y="0" width="1440" height="900" fill="#ffffff"/><g id="Top bar"><rect x="0" y="63" width="1440" height="1" fill="#e4e4e7"/><rect x="32" y="17.5" width="28" height="28" rx="8" fill="#4f39f6"/><text x="39.77" y="35.25" fill="#ffffff" font-family="Inter" font-size="11" font-weight="700" xml:space="preserve">LL</text><text x="70" y="37.5" fill="#18181b" font-family="Inter" font-size="16" font-weight="600" xml:space="preserve">Linear-lite</text><text x="1144.91" y="36.5" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Signed in as</text><text x="1229.61" y="36.5" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">aarav@acme.dev</text><text x="1349.92" y="36.5" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">·</text><text x="1357.91" y="36.5" fill="#52525c" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Log out</text><rect x="1357.91" y="38.18" width="50.09" height="1" fill="#52525c"/></g><g id="Stepper"><rect x="534.03" y="120" width="24" height="24" rx="12" fill="#4f39f6"/><text x="543.48" y="136" fill="#ffffff" font-family="Inter" font-size="12" font-weight="600" xml:space="preserve">1</text><text x="566.03" y="137" fill="#18181b" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Workspace</text><rect x="653.88" y="131.5" width="40" height="1" fill="#d4d4d8"/><rect x="706.38" y="120.5" width="23" height="23" rx="11.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="714.17" y="136" fill="#71717b" font-family="Inter" font-size="12" font-weight="500" xml:space="preserve">2</text><text x="737.88" y="137" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Team</text><rect x="786.25" y="131.5" width="40" height="1" fill="#d4d4d8"/><rect x="838.75" y="120.5" width="23" height="23" rx="11.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="846.48" y="136" fill="#71717b" font-family="Inter" font-size="12" font-weight="500" xml:space="preserve">3</text><text x="870.25" y="137" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Invite</text></g><g id="Workspace form"><text x="490" y="216" fill="#18181b" font-family="Inter" font-size="24" font-weight="600" letter-spacing="-0.6" xml:space="preserve">Create your workspace</text><text x="490" y="246" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">A workspace holds your teams, projects and issues. Most companies</text><text x="490" y="268.75" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">only need one.</text><g id="Field Workspace name"><text x="490" y="322.5" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Workspace name</text><rect x="490.5" y="334" width="459" height="39" rx="5.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="503" y="359" fill="#18181b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Acme</text></g><g id="Field Workspace URL"><text x="490" y="408.5" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Workspace URL</text><rect x="488" y="417.5" width="464" height="44" rx="8" fill="none" stroke="#e0e7ff" stroke-width="4"/><rect x="490.5" y="420" width="459" height="39" rx="5.5" fill="none" stroke="#615fff" stroke-width="1"/><rect x="491" y="420.5" width="120.84" height="38" fill="#fafafa"/><rect x="610.84" y="420.5" width="1" height="38" fill="#d4d4d8"/><text x="503" y="444.5" fill="#71717b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">linear-lite.app/</text><text x="623.84" y="445" fill="#18181b" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">acme</text><g transform="translate(921 431.5) scale(0.6667 0.6667)"><g fill="none" stroke="#009966" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></g></g><text x="490" y="477.5" fill="#007a55" font-family="Inter" font-size="12" font-weight="400" xml:space="preserve">acme is available</text></g><g id="Field Team size"><text x="490" y="516.5" fill="#27272a" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">How many people will use it?</text><rect x="490.5" y="528" width="108" height="35" rx="5.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="518.19" y="550.5" fill="#3f3f47" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">Just me</text><rect x="606.5" y="527" width="110" height="37" rx="6.5" fill="none" stroke="#4f39f6" stroke-width="1"/><rect x="607.5" y="528" width="108" height="35" rx="5.5" fill="#eef2ff" stroke="#4f39f6" stroke-width="1"/><text x="646.25" y="550.5" fill="#432dd7" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">2–10</text><rect x="724.5" y="528" width="108" height="35" rx="5.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="760.73" y="550.5" fill="#3f3f47" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">11–50</text><rect x="841.5" y="528" width="108" height="35" rx="5.5" fill="none" stroke="#d4d4d8" stroke-width="1"/><text x="882.3" y="550.5" fill="#3f3f47" font-family="Inter" font-size="14" font-weight="400" xml:space="preserve">50+</text></g><g id="Button Continue"><rect x="490" y="595.5" width="460" height="40" rx="6" fill="#4f39f6"/><text x="689.73" y="620.5" fill="#ffffff" font-family="Inter" font-size="14" font-weight="500" xml:space="preserve">Continue</text></g></g></g></svg>
